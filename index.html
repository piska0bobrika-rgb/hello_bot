<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello World Mini App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
            padding: 30px;
        }

        .logo {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            opacity: 0.7;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;

            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, white);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🌍</div>

    <h1>Hello World!</h1>

    <p>Добро пожаловать в моё Telegram Mini App</p>

    <button onclick="hello()">
        Нажми меня
    </button>

</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function hello() {
        tg.showAlert("Hello World! 👋");
    }

</script>

</body>
</html>
